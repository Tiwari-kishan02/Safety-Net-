<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake Email Detector</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; }
        h1 { color: #2c3e50; }
        h2 { color: #2c3e50; margin-top: 40px; font-size: 20px; }
        textarea { width: 100%; height: 150px; padding: 10px; font-size: 16px; }
        input[type=text], input[type=file] { width: 100%; padding: 10px; font-size: 16px; margin-top: 5px; }
        button { margin-top: 10px; padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 5px; }
        .safe { background-color: #d4edda; color: #155724; }
        .scam { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Fake Email Detector</h1>

    <form method="POST">
        <textarea name="email_text" placeholder="Paste the suspicious email content here..."></textarea><br>
        <button type="submit">Check Email Text</button>
    </form>
    {% if result %}
        <div class="result {% if 'FAKE' in result %}scam{% else %}safe{% endif %}">{{ result }}</div>
    {% endif %}

    <h2>Upload Email Screenshot</h2>
    <form method="POST" enctype="multipart/form-data" action="/email-check-image">
        <input type="file" name="email_image" accept="image/*"><br>
        <button type="submit">Check Screenshot</button>
    </form>
    {% if image_result %}
        <div class="result {% if 'FAKE' in image_result %}scam{% else %}safe{% endif %}">{{ image_result }}</div>
    {% endif %}

    <h2>Check Sender's Email Address</h2>
    <form method="POST" action="/email-address-check">
        <input type="text" name="sender_email" placeholder="Enter sender's email address"><br>
        <button type="submit">Check Address</button>
    </form>
    {% if address_result %}
        <div class="result {% if 'SUSPICIOUS' in address_result %}scam{% else %}safe{% endif %}">{{ address_result }}</div>
    {% endif %}
</body>
</html>
